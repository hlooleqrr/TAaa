<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سرعة تملك العقار والحلول التمويلية</title>
<style>
body{font-family:Tahoma;background:#0f172a;color:#fff;text-align:center;margin:0}
.container{margin-top:100px;padding:0 12px;}
input{padding:12px;width:260px;border-radius:10px;border:none;margin:10px;font-size:16px;text-align:center}
button{padding:12px 20px;border:none;border-radius:10px;background:#2563eb;color:#fff;font-size:16px;cursor:pointer;font-weight:700}
button:hover{background:#1d4ed8}
.card{background:#111827;padding:22px;border-radius:14px;width:90%;max-width:520px;margin:20px auto}
.result{background:#0b3aa7;padding:14px;border-radius:12px;margin-top:18px;font-size:20px;font-weight:800}
.badge{display:inline-block;padding:10px 14px;border-radius:12px;border:2px solid #60a5fa;background:#1e3a8a;color:#cfe2ff;font-weight:900}
.small{font-size:14px;color:#cbd5e1;margin-top:12px;line-height:1.8}
</style>
</head>
<body>

<div id="login" class="container">
<h2>سرعة تملك العقار والحلول التمويلية</h2>
<input type="password" id="password" placeholder="ادخل الرقم السري">
<br>
<button onclick="checkPass()">دخول</button>
</div>

<div id="main" style="display:none;">
<div class="card">
<h3>نسب تحويل مديونية التمويل الشخصي</h3>
<input type="number" id="salary" placeholder="اذكر الراتب الصافي">
<br>
<button onclick="recommend()">رشح البنك</button>
<div id="output"></div>
</div>
</div>

<script>

function checkPass(){
if(document.getElementById("password").value==="11qq11qQ"){
document.getElementById("login").style.display="none";
document.getElementById("main").style.display="block";
}else{alert("رقم سري غير صحيح");}
}

function getRate(bank,s){

if(bank==="الأهلي"){
if(s>=45000) return 0.99;
if(s>=25000) return 1.59;
if(s>=15000) return 1.95;
if(s>=10000) return 2.99;
if(s>=7000) return 3.50;
if(s>=4000) return 3.99;
if(s>=3000) return 4.49;
}

if(bank==="الرياض"){
if(s>=40000) return 1.99;
if(s>=25000) return 2.09;
if(s>=20000) return 2.59;
if(s>=10000) return 3.09;
if(s>=6000) return 4.09;
if(s>=3000) return 4.19;
}

// تعديل ساب هنا 👇
if(bank==="ساب"){
if(s>=30000) return 1.79;
if(s>=15000) return 1.99;
if(s>=3000)  return 2.29;
}

if(bank==="الراجحي"){
if(s>=40000) return 2.09;
if(s>=25000) return 2.19;
if(s>=15000) return 2.29;
if(s>=10000) return 2.75;
if(s>=4000) return 4.00;
}

if(bank==="العربي"){
if(s>=70000) return 1.59;
if(s>=40000) return 1.79;
if(s>=25000) return 1.99;
if(s>=15000) return 2.09;
if(s>=10000) return 2.29;
if(s>=5000) return 3.29;
}

if(bank==="الجزيرة"){
if(s>=50000) return 1.49;
if(s>=30000) return 1.69;
if(s>=15000) return 1.89;
if(s>=10000) return 2.89;
if(s>0) return 3.50;
}

return 999;
}

function recommend(){
let salary=parseFloat(document.getElementById("salary").value);
if(!salary){alert("ادخل الراتب");return;}

let banks=["الأهلي","الرياض","ساب","الراجحي","العربي","الجزيرة"];
let results=banks.map(b=>({name:b,rate:getRate(b,salary)})).filter(b=>b.rate!==999);

results.sort((a,b)=>a.rate-b.rate);

let best=results[0];
let ranking=results.map((b,i)=> (i+1)+") "+b.name+" ("+b.rate+"%)").join("<br>");

document.getElementById("output").innerHTML=
'<div class="result">البنك المرشح:<br>'+best.name+
'<br><br><span class="badge">'+best.rate+'%</span></div>'+
'<div class="small"><br><b>ترتيب البنوك المنافسة:</b><br>'+ranking+'</div>';
}

</script>

</body>
</html>
