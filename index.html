<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سرعة تملك العقار | الحلول التمويلية</title>

<style>
body{
font-family:Tahoma;
background:#f5f5f5;
margin:0;
padding:0;
}

.topbar{
background:#0b6b5c;
color:#fff;
padding:25px;
text-align:center;
font-size:32px;
font-weight:bold;
}

.sub{
font-size:20px;
margin-top:10px;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.box{
background:#fff;
padding:25px;
border-radius:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
margin-top:25px;
}

input,select{
width:100%;
padding:15px;
font-size:20px;
border-radius:12px;
border:1px solid #ccc;
margin-top:15px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
font-size:22px;
border:none;
border-radius:14px;
background:#0b6b5c;
color:#fff;
margin-top:20px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#095347;
}

.icons{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-top:30px;
}

.card{
background:#fff;
padding:40px 20px;
text-align:center;
border-radius:20px;
font-size:28px;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 10px rgba(0,0,0,0.1);
transition:.3s;
}

.card:hover{
transform:scale(1.03);
}

.result{
background:#fff;
padding:25px;
border-radius:20px;
margin-top:25px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.best{
font-size:34px;
color:#0b6b5c;
font-weight:bold;
margin-bottom:20px;
}

.bank{
font-size:26px;
margin-top:15px;
padding:15px;
background:#f1f1f1;
border-radius:12px;
}

.note{
margin-top:20px;
background:#fff8e1;
padding:20px;
border-radius:15px;
font-size:22px;
line-height:2;
font-weight:bold;
}

.red{
color:red;
font-size:26px;
font-weight:bold;
margin-top:20px;
text-align:center;
}

.hidden{
display:none;
}
</style>
</head>

<body>

<div class="topbar">
سرعة تملك العقار
<div class="sub">الحلول التمويلية</div>
</div>

<div class="container">

<!-- تسجيل الدخول -->

<div class="box" id="loginBox">

<h2>تسجيل الدخول</h2>

<input type="password" id="password" placeholder="ادخل الرقم السري">

<button onclick="checkPassword()">دخول</button>

</div>

<!-- الصفحة الرئيسية -->

<div id="homePage" class="hidden">

<div class="icons">

<div class="card" onclick="openDebt()">
🏦<br>
شراء المديونية
</div>

<div class="card" onclick="openPersonal()">
💰<br>
التمويل الشخصي
</div>

</div>

</div>

<!-- شراء المديونية -->

<div id="debtPage" class="hidden">

<div class="box">

<h2>شراء المديونية</h2>

<input type="number" id="salaryDebt" placeholder="ادخل الراتب الصافي">

<button onclick="calculateDebt()">عرض أفضل البنوك</button>

</div>

<div id="debtResult"></div>

</div>

<!-- التمويل الشخصي -->

<div id="personalPage" class="hidden">

<div class="box">

<h2>التمويل الشخصي</h2>

<input type="number" id="salaryPersonal" placeholder="ادخل الراتب الصافي">

<select id="jobType">
<option value="مدني">مدني</option>
<option value="عسكري">عسكري</option>
<option value="متقاعد">متقاعد</option>
</select>

<button onclick="calculatePersonal()">عرض أفضل البنوك</button>

</div>

<div id="personalResult"></div>

</div>

</div>

<script>

const PASSWORD = "qq11qQ";

function checkPassword(){

const pass = document.getElementById("password").value;

if(pass === PASSWORD){

document.getElementById("loginBox").classList.add("hidden");
document.getElementById("homePage").classList.remove("hidden");

}else{
alert("الرقم السري غير صحيح");
}

}

function openDebt(){

document.getElementById("debtPage").classList.remove("hidden");
document.getElementById("personalPage").classList.add("hidden");

}

function openPersonal(){

document.getElementById("personalPage").classList.remove("hidden");
document.getElementById("debtPage").classList.add("hidden");

}

/* =========================
شراء المديونية
========================= */

function calculateDebt(){

let salary = parseInt(document.getElementById("salaryDebt").value);

let banks = [];

/* العربي */

if(salary <= 4999){
banks.push({name:"البنك العربي", rate:4.89});
}else if(salary <= 9999){
banks.push({name:"البنك العربي", rate:3.49});
}else if(salary <= 14999){
banks.push({name:"البنك العربي", rate:2.59});
}else if(salary <= 24999){
banks.push({name:"البنك العربي", rate:2.39});
}else if(salary <= 39999){
banks.push({name:"البنك العربي", rate:2.09});
}else if(salary <= 69999){
banks.push({name:"البنك العربي", rate:1.89});
}else{
banks.push({name:"البنك العربي", rate:1.59});
}

/* الأهلي */

if(salary >=3000 && salary <=3999){
banks.push({name:"البنك الأهلي", rate:4.49});
}else if(salary <=6999){
banks.push({name:"البنك الأهلي", rate:3.99});
}else if(salary <=9999){
banks.push({name:"البنك الأهلي", rate:3.50});
}else if(salary <=14999){
banks.push({name:"البنك الأهلي", rate:2.99});
}else if(salary <=24999){
banks.push({name:"البنك الأهلي", rate:1.95});
}else if(salary <=44999){
banks.push({name:"البنك الأهلي", rate:1.59});
}else{
banks.push({name:"البنك الأهلي", rate:0.99});
}

/* الأول */

if(salary <=14999){
banks.push({name:"بنك الأول SAB", rate:2.29});
}else if(salary <=29999){
banks.push({name:"بنك الأول SAB", rate:1.99});
}else{
banks.push({name:"بنك الأول SAB", rate:1.79});
}

/* الراجحي */

if(salary <=9999){
banks.push({name:"مصرف الراجحي", rate:4.00});
}else if(salary <=14999){
banks.push({name:"مصرف الراجحي", rate:2.75});
}else if(salary <=24999){
banks.push({name:"مصرف الراجحي", rate:2.29});
}else if(salary <=39999){
banks.push({name:"مصرف الراجحي", rate:2.19});
}else{
banks.push({name:"مصرف الراجحي", rate:2.09});
}

/* الانماء */

if(salary <=9999){
banks.push({name:"مصرف الإنماء", rate:3.00});
}else{
banks.push({name:"مصرف الإنماء", rate:2.85});
}

/* الجزيرة */

if(salary <=4999){
banks.push({name:"بنك الجزيرة", rate:3.50});
}else if(salary <=14999){
banks.push({name:"بنك الجزيرة", rate:2.89});
}else if(salary <=29999){
banks.push({name:"بنك الجزيرة", rate:1.89});
}else if(salary <=49999){
banks.push({name:"بنك الجزيرة", rate:1.69});
}else{
banks.push({name:"بنك الجزيرة", rate:1.49});
}

banks.sort((a,b)=>a.rate-b.rate);

let html = `
<div class="result">
<div class="best">
🏆 الأفضل لك: ${banks[0].name}
<br>
النسبة: ${banks[0].rate}%
</div>
`;

banks.forEach((bank,index)=>{

html += `
<div class="bank">
${index+1} - ${bank.name}
<br>
النسبة: ${bank.rate}%
</div>
`;

});

html += `</div>`;

document.getElementById("debtResult").innerHTML = html;

}

/* =========================
التمويل الشخصي
========================= */

function calculatePersonal(){

let salary = parseInt(document.getElementById("salaryPersonal").value);
let job = document.getElementById("jobType").value;

let banks = [];

/* STC */

banks.push({
name:"STC BANK",
rate:1.89,
note:"بتحويل الراتب"
});

banks.push({
name:"STC BANK",
rate:2.99,
note:"بدون تحويل راتب"
});

/* الراجحي */

let rajhiRate = 0;
let note = "";

if(job == "مدني"){

if(salary <=2999){ rajhiRate = 3.92; }
else if(salary <=3999){ rajhiRate = 3.92; }
else if(salary <=4999){ rajhiRate = 3.92; }
else if(salary <=5999){ rajhiRate = 2.95; }
else if(salary <=6999){ rajhiRate = 2.94; }
else if(salary <=7999){ rajhiRate = 2.85; }
else if(salary <=8999){ rajhiRate = 2.78; }
else if(salary <=9999){ rajhiRate = 2.51; }
else if(salary <=11999){ rajhiRate = 2.47; }
else if(salary <=14999){ rajhiRate = 2.47; }
else if(salary <=19999){ rajhiRate = 2.47; }
else if(salary <=24999){ rajhiRate = 2.42; }
else{ rajhiRate = 2.41; }

note = "وطني 1";

}

if(job == "عسكري"){

if(salary <=2999){ rajhiRate = 3.99; }
else if(salary <=3999){ rajhiRate = 3.98; }
else if(salary <=4999){ rajhiRate = 3.98; }
else if(salary <=5999){ rajhiRate = 3.10; }
else if(salary <=6999){ rajhiRate = 3.09; }
else if(salary <=7999){ rajhiRate = 2.96; }
else if(salary <=8999){ rajhiRate = 2.94; }
else if(salary <=9999){ rajhiRate = 2.88; }
else if(salary <=11999){ rajhiRate = 2.81; }
else if(salary <=14999){ rajhiRate = 2.80; }
else if(salary <=19999){ rajhiRate = 2.73; }
else if(salary <=24999){ rajhiRate = 2.71; }
else{ rajhiRate = 2.69; }

note = "وطني 1";

}

if(job == "متقاعد"){

if(salary <=2999){ rajhiRate = 3.92; }
else if(salary <=3999){ rajhiRate = 3.92; }
else if(salary <=4999){ rajhiRate = 3.92; }
else if(salary <=5999){ rajhiRate = 2.95; }
else if(salary <=6999){ rajhiRate = 2.94; }
else if(salary <=7999){ rajhiRate = 2.85; }
else if(salary <=8999){ rajhiRate = 2.78; }
else if(salary <=9999){ rajhiRate = 2.66; }
else if(salary <=11999){ rajhiRate = 2.62; }
else if(salary <=14999){ rajhiRate = 2.62; }
else if(salary <=19999){ rajhiRate = 2.52; }
else if(salary <=24999){ rajhiRate = 2.42; }
else{ rajhiRate = 2.41; }

note = "وطني 1";

}

banks.push({
name:"مصرف الراجحي",
rate:rajhiRate,
note:note
});

banks.sort((a,b)=>a.rate-b.rate);

let html = `
<div class="result">

<div class="best">
🏆 الأفضل لك: ${banks[0].name}
<br>
النسبة: ${banks[0].rate}%
<br>
${banks[0].note}
</div>
`;

banks.forEach((bank,index)=>{

html += `
<div class="bank">
${index+1} - ${bank.name}
<br>
النسبة: ${bank.rate}%
<br>
${bank.note}
</div>
`;

});

html += `

<div class="note">

📌 ملاحظة مهمة:

إذا عليك تمويل حالي في الراجحي يتم احتسابك على نسبة وطني 2 وليس وطني 1.

<br><br>

✅ المدني له نسبة مختلفة  
✅ العسكري له نسبة مختلفة  
✅ المتقاعد له نسبة مختلفة

</div>

<div class="red">
⏰ تاريخ انتهاء عرض الراجحي:
30 / 06 / 2026
</div>

</div>
`;

document.getElementById("personalResult").innerHTML = html;

}

</script>

</body>
</html>
