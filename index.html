<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سرعة تملك العقار | الحلول التمويلية</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#083d36,#0b6b5c,#0f8f79);
min-height:100vh;
overflow-x:hidden;
color:#fff;
}

.bg{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
overflow:hidden;
z-index:-1;
}

.bg span{
position:absolute;
display:block;
width:25px;
height:25px;
background:rgba(255,255,255,0.08);
animation:move 20s linear infinite;
bottom:-150px;
border-radius:50%;
}

.bg span:nth-child(1){left:10%;animation-duration:15s;width:40px;height:40px;}
.bg span:nth-child(2){left:20%;animation-duration:20s;}
.bg span:nth-child(3){left:35%;animation-duration:12s;width:50px;height:50px;}
.bg span:nth-child(4){left:50%;animation-duration:18s;}
.bg span:nth-child(5){left:65%;animation-duration:25s;width:60px;height:60px;}
.bg span:nth-child(6){left:80%;animation-duration:14s;}
.bg span:nth-child(7){left:90%;animation-duration:22s;width:45px;height:45px;}

@keyframes move{
0%{
transform:translateY(0) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(-1200px) rotate(720deg);
opacity:0;
}
}

.topbar{
padding:35px 20px;
text-align:center;
font-size:38px;
font-weight:900;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

.sub{
font-size:20px;
margin-top:10px;
color:#d9fff6;
}

.datetime{
margin-top:15px;
font-size:18px;
color:#fff;
}

.container{
max-width:950px;
margin:auto;
padding:25px;
}

.glass{
background:rgba(255,255,255,0.12);
backdrop-filter:blur(12px);
border-radius:25px;
padding:30px;
margin-top:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.25);
animation:fade .7s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

input,select{
width:100%;
padding:18px;
border:none;
border-radius:18px;
margin-top:18px;
font-size:20px;
background:rgba(255,255,255,0.95);
color:#000;
}

button{
width:100%;
padding:18px;
border:none;
border-radius:18px;
margin-top:20px;
font-size:22px;
font-weight:900;
cursor:pointer;
transition:.3s;
background:#fff;
color:#0b6b5c;
}

button:hover{
transform:scale(1.02);
}

.icons{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
margin-top:35px;
}

.card{
background:rgba(255,255,255,0.12);
backdrop-filter:blur(10px);
padding:45px 20px;
border-radius:30px;
text-align:center;
font-size:30px;
font-weight:900;
cursor:pointer;
transition:.4s;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.card:hover{
transform:translateY(-8px) scale(1.03);
background:rgba(255,255,255,0.2);
}

.result{
margin-top:25px;
}

.best{
background:#fff;
color:#0b6b5c;
padding:25px;
border-radius:22px;
font-size:34px;
font-weight:900;
line-height:2;
text-align:center;
}

.bank{
margin-top:18px;
padding:22px;
background:rgba(255,255,255,0.15);
border-radius:20px;
font-size:24px;
line-height:2;
}

.note{
background:#fff3cd;
color:#000;
padding:22px;
border-radius:20px;
margin-top:25px;
font-size:22px;
line-height:2;
font-weight:bold;
}

.expired{
background:#ff4d4d;
padding:18px;
border-radius:18px;
margin-top:20px;
font-size:24px;
font-weight:900;
text-align:center;
animation:flash 1s infinite;
}

@keyframes flash{
0%{opacity:1;}
50%{opacity:.4;}
100%{opacity:1;}
}

.activeOffer{
background:#00c853;
padding:18px;
border-radius:18px;
margin-top:20px;
font-size:24px;
font-weight:900;
text-align:center;
}

.shareButtons{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:25px;
}

.hidden{
display:none;
}

@media(max-width:700px){

.icons{
grid-template-columns:1fr;
}

.topbar{
font-size:28px;
}

.card{
font-size:24px;
}

.best{
font-size:28px;
}

}

</style>
</head>

<body>

<div class="bg">
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
</div>

<div class="topbar">

سرعة تملك العقار

<div class="sub">
الحلول التمويلية
</div>

<div class="datetime" id="datetime"></div>

</div>

<div class="container">

<!-- LOGIN -->

<div class="glass" id="loginBox">

<h1>تسجيل الدخول</h1>

<input type="password" id="password" placeholder="ادخل الرقم السري">

<button onclick="checkPassword()">
دخول
</button>

</div>

<!-- HOME -->

<div id="homePage" class="hidden">

<div class="icons">

<div class="card" onclick="openDebt()">
🏦<br>
شراء المديونية
</div>

<div class="card" onclick="openPersonal()">
💰<br>
التمويل الشخصي
</div>

</div>

</div>

<!-- شراء المديونية -->

<div id="debtPage" class="hidden">

<div class="glass">

<h1>شراء المديونية</h1>

<input type="number" id="salaryDebt" placeholder="ادخل الراتب الصافي">

<button onclick="calculateDebt()">
عرض أفضل البنوك
</button>

</div>

<div id="debtResult"></div>

</div>

<!-- التمويل الشخصي -->

<div id="personalPage" class="hidden">

<div class="glass">

<h1>التمويل الشخصي</h1>

<input type="number" id="salaryPersonal" placeholder="ادخل الراتب الصافي">

<select id="jobType">
<option value="مدني">مدني</option>
<option value="عسكري">عسكري</option>
<option value="متقاعد">متقاعد</option>
</select>

<button onclick="calculatePersonal()">
عرض أفضل البنوك
</button>

</div>

<div id="personalResult"></div>

</div>

</div>

<script>

/* الوقت والتاريخ */

function updateDateTime(){

const now = new Date();

document.getElementById("datetime").innerHTML =
now.toLocaleDateString('ar-SA') +
" | " +
now.toLocaleTimeString('ar-SA');

}

setInterval(updateDateTime,1000);
updateDateTime();

/* الرقم السري */

const PASSWORD = "11qq11qQ";

function checkPassword(){

const pass = document.getElementById("password").value;

if(pass === PASSWORD){

document.getElementById("loginBox").classList.add("hidden");
document.getElementById("homePage").classList.remove("hidden");

}else{

alert("❌ الرقم السري غير صحيح");

}

}

/* فتح الصفحات */

function openDebt(){

document.getElementById("debtPage").classList.remove("hidden");
document.getElementById("personalPage").classList.add("hidden");

}

function openPersonal(){

document.getElementById("personalPage").classList.remove("hidden");
document.getElementById("debtPage").classList.add("hidden");

}

/* التحقق من انتهاء العروض */

function checkOffer(endDate){

const today = new Date();
const end = new Date(endDate);

if(today > end){

return `
<div class="expired">
🚫 انتهى العرض
</div>
`;

}else{

return `
<div class="activeOffer">
✅ العرض ساري حتى ${endDate}
</div>
`;

}

}

/* مشاركة واتساب */

function shareWhatsApp(text){

const url =
"https://wa.me/?text=" + encodeURIComponent(text);

window.open(url,"_blank");

}

/* شراء المديونية */

function calculateDebt(){

let salary =
parseInt(document.getElementById("salaryDebt").value);

let banks = [];

/* العربي */

if(salary <= 4999){
banks.push({name:"البنك العربي",rate:4.89});
}else if(salary <=9999){
banks.push({name:"البنك العربي",rate:3.49});
}else if(salary <=14999){
banks.push({name:"البنك العربي",rate:2.59});
}else if(salary <=24999){
banks.push({name:"البنك العربي",rate:2.39});
}else if(salary <=39999){
banks.push({name:"البنك العربي",rate:2.09});
}else if(salary <=69999){
banks.push({name:"البنك العربي",rate:1.89});
}else{
banks.push({name:"البنك العربي",rate:1.59});
}

/* الأهلي */

if(salary <=3999){
banks.push({name:"البنك الأهلي",rate:4.49});
}else if(salary <=6999){
banks.push({name:"البنك الأهلي",rate:3.99});
}else if(salary <=9999){
banks.push({name:"البنك الأهلي",rate:3.50});
}else if(salary <=14999){
banks.push({name:"البنك الأهلي",rate:2.99});
}else if(salary <=24999){
banks.push({name:"البنك الأهلي",rate:1.95});
}else if(salary <=44999){
banks.push({name:"البنك الأهلي",rate:1.59});
}else{
banks.push({name:"البنك الأهلي",rate:0.99});
}

/* SAB */

if(salary <=14999){
banks.push({name:"بنك الأول SAB",rate:2.29});
}else if(salary <=29999){
banks.push({name:"بنك الأول SAB",rate:1.99});
}else{
banks.push({name:"بنك الأول SAB",rate:1.79});
}

/* الراجحي */

if(salary <=9999){
banks.push({name:"مصرف الراجحي",rate:4.00});
}else if(salary <=14999){
banks.push({name:"مصرف الراجحي",rate:2.75});
}else if(salary <=24999){
banks.push({name:"مصرف الراجحي",rate:2.29});
}else if(salary <=39999){
banks.push({name:"مصرف الراجحي",rate:2.19});
}else{
banks.push({name:"مصرف الراجحي",rate:2.09});
}

banks.sort((a,b)=>a.rate-b.rate);

let best = banks[0];

let shareText =
`🏆 أفضل بنك لك:
${best.name}
النسبة: ${best.rate}%

راتبك:
${salary} ريال

سرعة تملك العقار`;

let html = `
<div class="result">

<div class="best">
🏆 الأفضل لك
<br>
${best.name}
<br>
النسبة ${best.rate}%
</div>

`;

banks.forEach((bank,index)=>{

html += `
<div class="bank">
${index+1} - ${bank.name}
<br>
النسبة: ${bank.rate}%
</div>
`;

});

html += `

${checkOffer("2026-06-30")}

<div class="shareButtons">

<button onclick='shareWhatsApp(`${shareText}`)'>
مشاركة واتساب
</button>

<button onclick='window.print()'>
حفظ PDF / صورة
</button>

</div>

</div>
`;

document.getElementById("debtResult").innerHTML = html;

}

/* التمويل الشخصي */

function calculatePersonal(){

let salary =
parseInt(document.getElementById("salaryPersonal").value);

let job =
document.getElementById("jobType").value;

let banks = [];

/* STC */

banks.push({
name:"STC BANK",
rate:1.89,
note:"تحويل راتب"
});

banks.push({
name:"STC BANK",
rate:2.99,
note:"بدون تحويل راتب"
});

/* الراجحي */

let rajhi = 0;

if(job=="مدني"){

if(salary<=2999){rajhi=3.92;}
else if(salary<=3999){rajhi=3.92;}
else if(salary<=4999){rajhi=3.92;}
else if(salary<=5999){rajhi=2.95;}
else if(salary<=6999){rajhi=2.94;}
else if(salary<=7999){rajhi=2.85;}
else if(salary<=8999){rajhi=2.78;}
else if(salary<=9999){rajhi=2.51;}
else if(salary<=11999){rajhi=2.47;}
else if(salary<=14999){rajhi=2.47;}
else if(salary<=19999){rajhi=2.47;}
else if(salary<=24999){rajhi=2.42;}
else{rajhi=2.41;}

}

if(job=="عسكري"){

if(salary<=2999){rajhi=3.99;}
else if(salary<=3999){rajhi=3.98;}
else if(salary<=4999){rajhi=3.98;}
else if(salary<=5999){rajhi=3.10;}
else if(salary<=6999){rajhi=3.09;}
else if(salary<=7999){rajhi=2.96;}
else if(salary<=8999){rajhi=2.94;}
else if(salary<=9999){rajhi=2.88;}
else if(salary<=11999){rajhi=2.81;}
else if(salary<=14999){rajhi=2.80;}
else if(salary<=19999){rajhi=2.73;}
else if(salary<=24999){rajhi=2.71;}
else{rajhi=2.69;}

}

if(job=="متقاعد"){

if(salary<=2999){rajhi=3.92;}
else if(salary<=3999){rajhi=3.92;}
else if(salary<=4999){rajhi=3.92;}
else if(salary<=5999){rajhi=2.95;}
else if(salary<=6999){rajhi=2.94;}
else if(salary<=7999){rajhi=2.85;}
else if(salary<=8999){rajhi=2.78;}
else if(salary<=9999){rajhi=2.66;}
else if(salary<=11999){rajhi=2.62;}
else if(salary<=14999){rajhi=2.62;}
else if(salary<=19999){rajhi=2.52;}
else if(salary<=24999){rajhi=2.42;}
else{rajhi=2.41;}

}

banks.push({
name:"مصرف الراجحي",
rate:rajhi,
note:"وطني 1"
});

banks.sort((a,b)=>a.rate-b.rate);

let best = banks[0];

let shareText =
`🏆 أفضل تمويل شخصي لك

البنك:
${best.name}

النسبة:
${best.rate}%

نوع الوظيفة:
${job}

الراتب:
${salary} ريال

سرعة تملك العقار`;

let html = `
<div class="result">

<div class="best">

🏆 الأفضل لك
<br>
${best.name}
<br>
النسبة ${best.rate}%

</div>
`;

banks.forEach((bank,index)=>{

html += `
<div class="bank">

${index+1} - ${bank.name}
<br>
النسبة: ${bank.rate}%
<br>
${bank.note || ""}

</div>
`;

});

html += `

<div class="note">

📌 ملاحظة مهمة:

إذا عليك تمويل حالي بالراجحي يتم احتسابك على وطني 2 وليس وطني 1.

<br><br>

✅ المدني له نسب مختلفة  
✅ العسكري له نسب مختلفة  
✅ المتقاعد له نسب مختلفة

</div>

${checkOffer("2026-06-30")}

<div class="shareButtons">

<button onclick='shareWhatsApp(`${shareText}`)'>
مشاركة واتساب
</button>

<button onclick='window.print()'>
حفظ PDF / صورة
</button>

</div>

</div>
`;

document.getElementById("personalResult").innerHTML = html;

}

</script>

</body>
</html>
