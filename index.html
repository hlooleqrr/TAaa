<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>سرعة تملك العقار | الحلول التمويلية</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#07131f;
overflow-x:hidden;
color:#fff;
min-height:100vh;
}

/* الخلفية */

.bg{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
overflow:hidden;
z-index:-1;
background:
linear-gradient(180deg,#07131f,#0c2235,#07131f);
}

.circle{
position:absolute;
border-radius:50%;
background:rgba(0,255,180,0.08);
animation:float 10s infinite ease-in-out;
}

.circle:nth-child(1){
width:300px;
height:300px;
top:-100px;
right:-80px;
}

.circle:nth-child(2){
width:220px;
height:220px;
bottom:-80px;
left:-60px;
animation-duration:13s;
}

.circle:nth-child(3){
width:140px;
height:140px;
top:40%;
left:40%;
animation-duration:8s;
}

@keyframes float{
0%{transform:translateY(0px);}
50%{transform:translateY(30px);}
100%{transform:translateY(0px);}
}

/* شاشة الدخول */

.login-box{
width:95%;
max-width:420px;
margin:50px auto;
background:rgba(255,255,255,0.07);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,0.08);
border-radius:30px;
padding:30px;
text-align:center;
box-shadow:0 0 40px rgba(0,0,0,0.4);
}

.hero{
font-size:85px;
margin-bottom:10px;
animation:updown 3s infinite;
}

@keyframes updown{
0%{transform:translateY(0);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0);}
}

h1{
font-size:32px;
font-weight:900;
margin-bottom:5px;
color:#00ffc3;
}

.sub{
opacity:.9;
margin-bottom:25px;
font-size:16px;
}

input{
width:100%;
padding:16px;
border:none;
border-radius:16px;
font-size:18px;
margin-bottom:15px;
outline:none;
background:#fff;
color:#111;
font-weight:bold;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:16px;
font-size:20px;
font-weight:900;
cursor:pointer;
transition:.3s;
}

.login-btn{
background:linear-gradient(45deg,#00ffb7,#00b3ff);
color:#000;
}

.login-btn:hover{
transform:scale(1.03);
}

.error{
margin-top:15px;
font-size:18px;
font-weight:bold;
color:#ff5f5f;
display:none;
}

/* الرئيسية */

#mainPage{
display:none;
padding:20px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
gap:10px;
flex-wrap:wrap;
}

.logo{
font-size:28px;
font-weight:900;
color:#00ffc3;
}

.clock{
background:rgba(255,255,255,0.08);
padding:10px 18px;
border-radius:15px;
font-weight:bold;
font-size:16px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:30px;
}

.card{
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.08);
padding:30px 20px;
border-radius:25px;
text-align:center;
cursor:pointer;
transition:.3s;
backdrop-filter:blur(12px);
}

.card:hover{
transform:translateY(-8px) scale(1.02);
box-shadow:0 0 30px rgba(0,255,180,0.2);
}

.card-icon{
font-size:70px;
margin-bottom:15px;
}

.card h2{
font-size:28px;
margin-bottom:10px;
}

.card p{
opacity:.85;
line-height:1.8;
}

/* النوافذ */

.section{
display:none;
max-width:900px;
margin:auto;
}

.box{
background:rgba(255,255,255,0.08);
padding:25px;
border-radius:25px;
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.08);
}

.title{
font-size:35px;
font-weight:900;
margin-bottom:20px;
color:#00ffc3;
text-align:center;
}

.result{
margin-top:25px;
}

.bank{
background:#ffffff10;
padding:18px;
border-radius:18px;
margin-bottom:15px;
border:1px solid rgba(255,255,255,0.07);
}

.bank h3{
font-size:28px;
margin-bottom:8px;
color:#00ffc3;
}

.bank p{
font-size:20px;
line-height:2;
}

.best{
border:2px solid #00ffb7;
box-shadow:0 0 20px rgba(0,255,180,0.3);
}

.note{
margin-top:20px;
background:#ff000020;
border:2px solid #ff2b2b;
padding:18px;
border-radius:16px;
font-size:20px;
font-weight:bold;
line-height:2;
}

.expire{
color:#ff4d4d;
font-size:24px;
font-weight:900;
margin-top:10px;
}

.share-btn{
background:linear-gradient(45deg,#25D366,#1ebe5d);
color:#fff;
margin-top:20px;
font-size:22px;
}

.back-btn{
margin-top:20px;
background:#ffffff15;
color:#fff;
}

.footer{
text-align:center;
margin-top:40px;
opacity:.7;
font-size:15px;
}

</style>
</head>

<body>

<div class="bg">
<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>
</div>

<!-- تسجيل الدخول -->

<div class="login-box" id="loginPage">

<div class="hero">💸🏡🚗🛋️</div>

<div class="clock" id="clock"></div>

</div>

<div class="cards">

<div class="card" onclick="openDebt()">

</div>

<!-- شراء المديونية -->

<div class="section" id="debtSection">

<input type="number" id="salaryDebt" placeholder="ادخل الراتب الصافي">

<button class="login-btn" onclick="calculateDebt()">

<div class="result" id="debtResult"></div>

</div>

<button class="back-btn" onclick="goHome()">

</div>

</div>

<div class="footer">
© سرعة تملك العقار - الحلول التمويلية
</div>

</div>

<script>

/* كلمة المرور */

function login(){

const pass = document.getElementById("password").value;

if(pass === "11qq11qQ"){

document.getElementById("loginPage").style.display="none";
document.getElementById("mainPage").style.display="block";

}else{

document.getElementById("error").style.display="block";

}

}

/* الوقت */

function updateClock(){

const now = new Date();

document.getElementById("clock").innerHTML =
now.toLocaleDateString('ar-SA') +
" | " +
now.toLocaleTimeString('ar-SA');

}

setInterval(updateClock,1000);
updateClock();

/* فتح الأقسام */

function openDebt(){

hideAll();
document.getElementById("debtSection").style.display="block";

}

function openPersonal(){

hideAll();
document.getElementById("personalSection").style.display="block";

}

function goHome(){

hideAll();

}

function hideAll(){

document.getElementById("debtSection").style.display="none";
document.getElementById("personalSection").style.display="none";

}

/* شراء المديونية */

function calculateDebt(){

const salary = parseInt(document.getElementById("salaryDebt").value);

let banks = [];

/* العربي */

if(salary >= 5000 && salary <= 9999){
banks.push({name:"البنك العربي", rate:3.49});
}
else if(salary >= 10000 && salary <= 14999){
banks.push({name:"البنك العربي", rate:2.59});
}
else if(salary >= 15000 && salary <= 24999){

/* SAB */

banks.push({name:"SAB", rate:1.99});

else if(salary >= 30000){
banks.push({name:"SAB", rate:1.79});

/* الراجحي */

if(salary >= 4000 && salary <= 9999){
banks.push({name:"الراجحي", rate:4.00});

else if(salary >= 10000 && salary <= 14999){
banks.push({name:"الراجحي", rate:2.75});
}
else if(salary >= 15000 && salary <= 24999){
banks.push({name:"الراجحي", rate:2.29});
}
else if(salary >= 25000 && salary <= 39999){
banks.push({name:"الراجحي", rate:2.19});
}
else if(salary >= 40000){
banks.push({name:"الراجحي", rate:2.09});
}

/* الفرز */

banks.sort((a,b)=>a.rate-b.rate);

let html = "";

banks.forEach((bank,index)=>{

html += `
<div class="bank ${index===0 ? 'best':''}">
<h3>
${index===0 ? '🏆 الأفضل حالياً' : '📌 بنك منافس'}
</h3>

<p>
<b>${bank.name}</b><br>
النسبة: <b>${bank.rate}%</b>
</p>
</div>
`;

});

document.getElementById("debtResult").innerHTML = html;

}

/* مشاركة واتساب */

function shareWhats(id){

const text = document.getElementById(id).innerText;

window.open(
"https://wa.me/?text=" + encodeURIComponent(text),
"_blank"
);

}

</script>
