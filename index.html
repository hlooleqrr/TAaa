<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حلول تمويلية</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#0f172a;
overflow-x:hidden;
color:white;
min-height:100vh;
}

.bg{
position:fixed;
width:100%;
height:100%;
background:
linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.75)),
url('https://images.unsplash.com/photo-1560518883-ce09059eeffa?q=80&w=1400');
background-size:cover;
background-position:center;
z-index:-2;
}

.blur{
position:fixed;
width:100%;
height:100%;
backdrop-filter:blur(6px);
z-index:-1;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.15);
backdrop-filter:blur(12px);
border-radius:30px;
padding:30px;
margin-top:25px;
box-shadow:0 0 30px rgba(0,0,0,.35);
animation:fade .7s ease;
}

@keyframes fade{
from{opacity:0;transform:translateY(25px);}
to{opacity:1;transform:translateY(0);}
}

.title{
font-size:38px;
font-weight:900;
text-align:center;
margin-bottom:10px;
}

.sub{
text-align:center;
opacity:.9;
margin-bottom:30px;
font-size:18px;
}

.input{
width:100%;
padding:18px;
border:none;
outline:none;
border-radius:18px;
font-size:20px;
margin-bottom:20px;
background:white;
}

.btn{
width:100%;
padding:18px;
border:none;
border-radius:18px;
font-size:22px;
font-weight:900;
cursor:pointer;
background:linear-gradient(45deg,#16a34a,#22c55e);
color:white;
transition:.3s;
}

.btn:hover{
transform:scale(1.02);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.box{
background:rgba(255,255,255,.1);
border-radius:25px;
padding:25px;
text-align:center;
cursor:pointer;
transition:.3s;
border:1px solid rgba(255,255,255,.15);
}

.box:hover{
transform:translateY(-5px) scale(1.02);
background:rgba(255,255,255,.14);
}

.icon{
font-size:65px;
margin-bottom:10px;
}

.box h2{
font-size:25px;
}

.result{
margin-top:25px;
background:white;
color:#111827;
padding:25px;
border-radius:25px;
}

.best{
font-size:34px;
font-weight:900;
color:#16a34a;
margin-bottom:15px;
}

.bank{
background:#f3f4f6;
padding:15px;
border-radius:16px;
margin-bottom:12px;
font-size:22px;
font-weight:700;
}

.note{
background:#fef2f2;
padding:18px;
border-radius:18px;
margin-top:20px;
color:#991b1b;
font-size:20px;
font-weight:700;
line-height:2;
}

.expire{
margin-top:20px;
background:#dc2626;
color:white;
padding:16px;
border-radius:16px;
font-size:23px;
font-weight:900;
text-align:center;
}

.footer{
text-align:center;
margin-top:25px;
font-size:20px;
opacity:.9;
}

.share{
margin-top:15px;
background:#25D366;
}

.hidden{
display:none;
}

@media(max-width:700px){
.grid{
grid-template-columns:1fr;
}
.title{
font-size:30px;
}
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="blur"></div>

<div class="container">

<!-- LOGIN -->
<div class="card" id="loginPage">
<div class="title">🏦 حلول تمويلية</div>
<div class="sub">
سرعة التملك العقاري والتمويل الشخصي
</div>

<input type="password" id="password" class="input" placeholder="أدخل الرقم السري">

<button class="btn" onclick="checkPassword()">دخول</button>

<div id="error" style="margin-top:15px;color:#f87171;font-size:20px;text-align:center;"></div>
</div>

<!-- HOME -->
<div class="card hidden" id="homePage">

<div class="title">اختر الخدمة</div>

<div class="grid">

<div class="box" onclick="openDebt()">
<div class="icon">🏠💸</div>
<h2>نسبة شراء المديونية</h2>
</div>

<div class="box" onclick="openPersonal()">
<div class="icon">💳🚗🛋️</div>
<h2>التمويل الشخصي</h2>
</div>

</div>

<div class="footer" id="datetime"></div>

</div>

<!-- DEBT -->
<div class="card hidden" id="debtPage">

<div class="title">🏠 شراء المديونية</div>

<input type="number" id="salaryDebt" class="input" placeholder="أدخل الراتب الصافي">

<button class="btn" onclick="calculateDebt()">
عرض أفضل البنوك
</button>

<div id="debtResult"></div>

</div>

<!-- PERSONAL -->
<div class="card hidden" id="personalPage">

<div class="title">💳 التمويل الشخصي</div>

<select id="jobType" class="input">
<option value="مدني">مدني</option>
<option value="عسكري">عسكري</option>
<option value="متقاعد">متقاعد</option>
</select>

<input type="number" id="salaryPersonal" class="input" placeholder="أدخل الراتب الصافي">

<button class="btn" onclick="calculatePersonal()">
عرض أفضل البنوك
</button>

<div id="personalResult"></div>

</div>

</div>

<script>

const PASSWORD = "11qq11qQ";

function checkPassword(){

let pass = document.getElementById("password").value;

if(pass === PASSWORD){

document.getElementById("loginPage").classList.add("hidden");
document.getElementById("homePage").classList.remove("hidden");

}else{
document.getElementById("error").innerHTML="❌ الرقم السري غير صحيح";
}

}

function openDebt(){
hideAll();
document.getElementById("debtPage").classList.remove("hidden");
}

function openPersonal(){
hideAll();
document.getElementById("personalPage").classList.remove("hidden");
}

function hideAll(){
document.getElementById("homePage").classList.add("hidden");
document.getElementById("debtPage").classList.add("hidden");
document.getElementById("personalPage").classList.add("hidden");
}

function getDebtBanks(salary){

let banks=[];

/* العربي */
if(salary <= 4999){
banks.push({name:"البنك العربي",rate:4.89});
}
else if(salary <= 9999){
banks.push({name:"البنك العربي",rate:3.49});
}
else if(salary <= 14999){
banks.push({name:"البنك العربي",rate:2.59});
}
else if(salary <= 24999){
banks.push({name:"البنك العربي",rate:2.39});
}
else if(salary <= 39999){
banks.push({name:"البنك العربي",rate:2.09});
}
else if(salary <= 69000){
banks.push({name:"البنك العربي",rate:1.89});
}
else{
banks.push({name:"البنك العربي",rate:1.59});
}

/* الاهلي */
if(salary >=3000 && salary <=3999){
banks.push({name:"البنك الأهلي",rate:4.49});
}
else if(salary <=6999){
banks.push({name:"البنك الأهلي",rate:3.99});
}
else if(salary <=9999){
banks.push({name:"البنك الأهلي",rate:3.50});
}
else if(salary <=14999){
banks.push({name:"البنك الأهلي",rate:2.99});
}
else if(salary <=24999){
banks.push({name:"البنك الأهلي",rate:1.95});
}
else if(salary <=44999){
banks.push({name:"البنك الأهلي",rate:1.59});
}
else{
banks.push({name:"البنك الأهلي",rate:0.99});
}

/* الانماء */
if(salary >=5000 && salary <=9999){
banks.push({name:"الإنماء",rate:3.00});
}
else if(salary <=14999){
banks.push({name:"الإنماء",rate:2.85});
}
else if(salary <=19999){
banks.push({name:"الإنماء",rate:2.85});
}
else if(salary <=24999){
banks.push({name:"الإنماء",rate:2.85});
}
else{
banks.push({name:"الإنماء",rate:2.85});
}

/* الوطني */
if(salary >=5000 && salary <=9999){
banks.push({name:"البنك الوطني",rate:3.29});
}
else if(salary <=14999){
banks.push({name:"البنك الوطني",rate:2.29});
}
else if(salary <=24999){
banks.push({name:"البنك الوطني",rate:2.09});
}
else if(salary <=39999){
banks.push({name:"البنك الوطني",rate:1.99});
}
else if(salary <=69000){
banks.push({name:"البنك الوطني",rate:1.79});
}
else{
banks.push({name:"البنك الوطني",rate:1.59});
}

/* الراجحي */
if(salary >=4000 && salary <=9999){
banks.push({name:"الراجحي",rate:4.00});
}
else if(salary <=14999){
banks.push({name:"الراجحي",rate:2.75});
}
else if(salary <=24999){
banks.push({name:"الراجحي",rate:2.29});
}
else if(salary <=39999){
banks.push({name:"الراجحي",rate:2.19});
}
else{
banks.push({name:"الراجحي",rate:2.09});
}

banks.sort((a,b)=>a.rate-b.rate);

return banks;

}

function calculateDebt(){

let salary = parseFloat(document.getElementById("salaryDebt").value);

let banks = getDebtBanks(salary);

let html = `<div class="result">`;

html += `<div class="best">
🏆 الترشيح الأفضل: ${banks[0].name}
<br>
النسبة: ${banks[0].rate}%
</div>`;

html += `<h2 style="margin-bottom:15px;">ترتيب البنوك:</h2>`;

banks.forEach((b,index)=>{
html += `
<div class="bank">
${index+1}- ${b.name} — ${b.rate}%
</div>
`;
});

html += `
<div class="note">
📌 النسب تقريبية حسب الراتب الحالي.<br>
📌 قد تختلف الموافقة حسب الالتزامات والجهة الوظيفية.
</div>
`;

html += `
<button class="btn share" onclick="shareWhatsApp('${banks[0].name}','${banks[0].rate}','شراء مديونية')">
مشاركة عبر واتساب
</button>
`;

html += `</div>`;

document.getElementById("debtResult").innerHTML = html;

}

function calculatePersonal(){

let salary = parseFloat(document.getElementById("salaryPersonal").value);
let job = document.getElementById("jobType").value;

let banks=[];

/* STC */
banks.push({
name:"STC BANK",
rate:1.89,
note:"بتحويل راتب"
});

banks.push({
name:"STC BANK",
rate:2.99,
note:"بدون تحويل راتب"
});

/* الراجحي */
let rajhi = 0;
let note = "";

if(job=="مدني") note="وطني 1";
if(job=="عسكري") note="وطني 1";
if(job=="متقاعد") note="وطني 1";

if(salary >=2000 && salary <=2999) rajhi=3.92;
else if(salary <=3999) rajhi=3.92;
else if(salary <=4999) rajhi=3.92;
else if(salary <=5999) rajhi=2.95;
else if(salary <=6999) rajhi=2.94;
else if(salary <=7999) rajhi=2.85;
else if(salary <=8999) rajhi=2.78;
else if(salary <=9999) rajhi=2.51;
else if(salary <=11999) rajhi=2.47;
else if(salary <=14999) rajhi=2.47;
else if(salary <=19999) rajhi=2.47;
else if(salary <=24999) rajhi=2.42;
else rajhi=2.41;

banks.push({
name:"الراجحي",
rate:rajhi,
note:note
});

banks.sort((a,b)=>a.rate-b.rate);

let html = `<div class="result">`;

html += `
<div class="best">
🏆 الترشيح الأفضل: ${banks[0].name}
<br>
النسبة: ${banks[0].rate}%
</div>
`;

banks.forEach((b,index)=>{

html += `
<div class="bank">
${index+1}- ${b.name}
<br>
النسبة: ${b.rate}%
<br>
${b.note}
</div>
`;

});

html += `
<div class="note">
⚠️ ملاحظة مهمة:<br><br>

إذا عليك تمويل حالي في الراجحي يتم الاحتساب على نسبة وطني 2.<br><br>

🟢 المدني: يتم احتساب نسبة المدني.<br>
🟢 العسكري: يتم احتساب نسبة العسكري.<br>
🟢 المتقاعد: يتم احتساب نسبة المتقاعد.<br>
</div>
`;

html += `
<div class="expire">
⛔ انتهاء عرض الراجحي بتاريخ 30 / 06 / 2026
</div>
`;

html += `
<button class="btn share" onclick="shareWhatsApp('${banks[0].name}','${banks[0].rate}','تمويل شخصي')">
مشاركة عبر واتساب
</button>
`;

html += `</div>`;

document.getElementById("personalResult").innerHTML = html;

}

function shareWhatsApp(bank,rate,type){

let text =
`🏦 ${type}

أفضل بنك مرشح:
${bank}

النسبة:
${rate}%

تم الإرسال من نظام الحلول التمويلية`;

window.open(
`https://wa.me/?text=${encodeURIComponent(text)}`
);

}

function updateDateTime(){

let now = new Date();

document.getElementById("datetime").innerHTML =
"📅 " +
now.toLocaleDateString('ar-SA') +
" | ⏰ " +
now.toLocaleTimeString('ar-SA');

}

setInterval(updateDateTime,1000);
updateDateTime();

</script>

</body>
</html>
